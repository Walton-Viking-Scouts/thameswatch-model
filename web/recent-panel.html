<!doctype html>
<!--
  ThamesWatch "storm panel" — last 96 h, on a shared timeline:
    · MAIN chart: rainfall (bars, left axis) + river flow (line, right axis)
    · DISCHARGE strip (below, no y-axis): when each upstream overflow was discharging —
      a single band row by default, or one row per monitor with the "Per-overflow detail"
      toggle. Aligned to the main chart's time axis.
  Reads recent.json (emitted by scripts/build_recent.py, committed every workflow run).

  Embed in WordPress: paste from <div class="tw-panel"> to the end of the final
  </script> into a Custom HTML block (the two CDN <script src> tags are included).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThamesWatch — recent conditions</title>
</head>
<body style="margin:0;background:#fff">

<div class="tw-panel" style="font-family:system-ui,sans-serif;max-width:780px;margin:1.5em auto;color:#222">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:1em;flex-wrap:wrap">
    <h3 style="margin:0">Recent conditions — last 96 h</h3>
    <span style="font-size:.9em;color:#555">
      <label>Site <select id="tw-site" style="font-size:1em;padding:.2em"></select></label>
      <label style="margin-left:1em"><input type="checkbox" id="tw-detail-toggle"> Per-overflow detail</label>
    </span>
  </div>
  <p style="margin:.3em 0 .5em;font-size:.85em;color:#666">
    Rainfall drives the river flow and the upstream sewage overflows. <span id="tw-when"></span>
  </p>
  <div id="tw-rag" style="position:relative;height:15px;margin-bottom:3px"></div>
  <div style="position:relative;height:240px"><canvas id="tw-main"></canvas></div>
  <div id="tw-discharge" style="margin-top:.3em"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
(function () {
  // Reads the committed recent.json. Override with ?src=... to point at a same-origin copy.
  var RECENT_URL = new URLSearchParams(location.search).get("src") ||
    "https://raw.githubusercontent.com/Walton-Viking-Scouts/thameswatch-model/main/recent.json";

  var SYS = { Wey:"#b5651d", Mole:"#1e783c", Thames:"#3c5aa0", Hogsmill:"#c2255c", ThamesUpstream:"#8a3ffc", Minor:"#777" };
  var SYS_LABEL = { Wey:"Wey", Mole:"Mole", Thames:"Thames", Hogsmill:"Hogsmill", ThamesUpstream:"Thames ↑", Minor:"Minor" };
  var SYS_ORDER = ["Wey", "Mole", "Thames", "Hogsmill", "ThamesUpstream", "Minor"];
  var RAG_COL = { GREEN:"#3aa655", AMBER:"#e8a317", RED:"#d23b3b" };

  var data, mainChart, curSite;

  function draw(site) {
    curSite = site;
    var s = data.sites[site];
    var t1 = new Date(data.generated_at).getTime();
    var t0 = t1 - data.window_hours * 3600 * 1000;

    // --- main chart: rain bars (left) + flow line (right) ---
    if (mainChart) mainChart.destroy();
    mainChart = new Chart(document.getElementById("tw-main"), {
      data: {
        datasets: [
          { type: "bar", label: "Rain (mm/h)", yAxisID: "yRain", order: 2,
            data: data.rain.map(function (p) { return { x: p.t, y: p.mm }; }),
            backgroundColor: "#2a7fff", barPercentage: 1, categoryPercentage: 1 },
          { type: "line", label: "Flow (m³/s)", yAxisID: "yFlow", order: 1,
            data: (data.flows[s.flow_gauge] || []).map(function (p) { return { x: p.t, y: p.m3s }; }),
            borderColor: "#1a9850", backgroundColor: "rgba(26,152,80,.12)",
            borderWidth: 2, pointRadius: 0, fill: true, tension: .25 }
        ]
      },
      options: {
        maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: { type: "time", min: t0, max: t1, time: { unit: "day", displayFormats: { day: "EEE d" } },
               grid: { display: false }, ticks: { maxRotation: 0 } },
          yRain: { position: "left", beginAtZero: true, title: { display: true, text: "Rain mm/h" },
                   grid: { display: false } },
          yFlow: { position: "right", beginAtZero: true, title: { display: true, text: "Flow m³/s" },
                   grid: { color: "rgba(0,0,0,.06)" } }
        },
        plugins: { legend: { display: true, labels: { boxWidth: 12 } } }
      }
    });

    // --- RAG status bar, aligned to the main chart's plot area ---
    requestAnimationFrame(function () {
      var ca = mainChart.chartArea; if (!ca) return;
      var L = ca.left, W = ca.right - ca.left;
      var t1 = new Date(data.generated_at).getTime();
      var t0 = t1 - data.window_hours * 3600 * 1000;
      var step = (data.rag_step_hours || 3) * 3600 * 1000;
      var segs = (data.rag || []).map(function (p, i) {
        var ts = new Date(p.t).getTime();
        var next = (data.rag[i + 1] ? new Date(data.rag[i + 1].t).getTime() : t1 + step);
        var x = Math.max(0, (ts - t0) / (t1 - t0) * 100);
        var w = Math.min(100, (next - t0) / (t1 - t0) * 100) - x;
        return '<div title="' + p.t.slice(0, 16) + ' UTC: ' + (p[site] || "?") +
          '" style="position:absolute;top:0;bottom:0;left:' + x + '%;width:' + Math.max(w, 0.2) +
          '%;background:' + (RAG_COL[p[site]] || "#ccc") + '"></div>';
      }).join("");
      document.getElementById("tw-rag").innerHTML =
        '<div style="position:absolute;left:' + L + 'px;width:' + W +
        'px;top:0;bottom:0;border-radius:3px;overflow:hidden">' + segs + '</div>' +
        '<div style="position:absolute;left:0;top:0;bottom:0;width:' + L +
        'px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;' +
        'font-size:.7em;color:#555;font-weight:600">RAG</div>';
    });

    // --- discharge strip, aligned to the main chart's plot area ---
    requestAnimationFrame(function () {
      var ca = mainChart.chartArea; if (!ca) return;
      var L = ca.left, W = ca.right - ca.left;
      var t1 = new Date(data.generated_at).getTime();
      var t0 = t1 - data.window_hours * 3600 * 1000;
      function seg(e, color) {
        var x0 = Math.max(0, (new Date(e.start).getTime() - t0) / (t1 - t0) * 100);
        var x1 = Math.min(100, (new Date(e.stop).getTime() - t0) / (t1 - t0) * 100);
        return '<div title="' + e.monitor + '  ' + e.start + ' → ' + e.stop +
          '" style="position:absolute;top:1px;bottom:1px;left:' + x0 + '%;width:' +
          Math.max(x1 - x0, 0.5) + '%;background:' + color + ';border-radius:2px"></div>';
      }
      function lane(inner, labelHTML) {
        return '<div style="position:relative;height:18px;margin:.1em 0">' +
          (labelHTML || "") +
          '<div style="position:absolute;left:' + L + 'px;width:' + W +
          'px;top:1px;bottom:1px;background:#f1f1f1;border-radius:3px;overflow:hidden">' + inner + '</div></div>';
      }

      function labelChip(text) {
        return '<span style="position:absolute;left:3px;top:0;line-height:16px;font-size:.72em;color:#222;' +
          'background:rgba(255,255,255,.8);padding:0 4px;border-radius:2px;white-space:nowrap">' + text + '</span>';
      }
      var detail = document.getElementById("tw-detail-toggle").checked;
      var body, caption;
      if (detail) {
        // one row per overflow monitor
        caption = "Sewage discharge by overflow";
        body = (s.monitors || []).map(function (m) {
          var inner = s.cso.filter(function (e) { return e.monitor === m.name; })
                            .map(function (e) { return seg(e, SYS[m.system] || "#777"); }).join("");
          return lane(inner + labelChip(m.name));
        }).join("");
      } else {
        // one row per relevant river system (union of its overflows)
        caption = "Sewage discharge by river";
        var relSys = SYS_ORDER.filter(function (sy) {
          return (s.monitors || []).some(function (m) { return m.system === sy; });
        });
        body = relSys.map(function (sy) {
          var inner = s.cso.filter(function (e) { return e.system === sy; })
                           .map(function (e) { return seg(e, SYS[sy]); }).join("");
          return lane(inner + labelChip(SYS_LABEL[sy] || sy));
        }).join("");
      }
      document.getElementById("tw-discharge").innerHTML =
        '<div style="font-size:.78em;color:#666;margin:.1em 0 .25em">' + caption +
        ' — last ' + data.window_hours + 'h</div>' + body;
    });
  }

  fetch(RECENT_URL, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    document.getElementById("tw-when").textContent =
      "Updated " + new Date(d.generated_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) + ".";
    var sel = document.getElementById("tw-site");
    Object.keys(d.sites).forEach(function (name) {
      var o = document.createElement("option"); o.value = o.textContent = name; sel.appendChild(o);
    });
    sel.value = "Walton Wharf";
    sel.addEventListener("change", function () { draw(sel.value); });
    document.getElementById("tw-detail-toggle").addEventListener("change", function () { draw(curSite); });
    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (curSite) draw(curSite); }, 150); });
    draw(sel.value);
  }).catch(function () {
    document.querySelector(".tw-panel").insertAdjacentHTML("beforeend",
      '<p style="color:#b00">Couldn’t load recent conditions right now.</p>');
  });
})();
</script>
</body>
</html>

name: predict

# Every 3 hours — captures live CSO discharge and tributary surges quickly (the live
# 15-minute flow + current-status feeds update within ~1h). Cron is UTC.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two predict runs (or a run and a manual dispatch) push concurrently — they
# would race on the same main ref. Queue them instead of cancelling, so none is lost.
concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so the rebase-and-push below is a clean fast-forward

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate, commit and push prediction
        run: |
          git config user.name "thameswatch-bot"
          git config user.email "actions@users.noreply.github.com"
          # main can advance between this job's checkout and its push (a merge, another
          # run). On every attempt we hard-reset to the freshest main and REGENERATE the
          # outputs against it, then commit only the generated artifacts.
          #
          # Why regenerate each attempt rather than carry a pre-built commit: the bot must
          # never author a tree that contains stale *source* files. The previous approach
          # (`git reset --soft` onto latest main, then commit the kept index) committed the
          # whole stale checkout tree — silently reverting any source file (config.py,
          # model.py, README static content) that landed on main during the run. Building
          # on a clean `reset --hard origin/main` each time means the commit's only diff is
          # the regenerated artifacts: prediction.json, recent.json, the README status
          # block (spliced into the up-to-date README), and the topped-up data CSVs.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/predict.py --json prediction.json --readme README.md
            python3 scripts/build_recent.py --json recent.json
            git add prediction.json recent.json README.md data/
            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Prediction update $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (main moved); retry $attempt."
            sleep $((RANDOM % 8 + 3))
          done
          echo "Failed to push prediction after 5 attempts." >&2
          exit 1
